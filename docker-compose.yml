services:
  spring:
    image: ${ECR_IMAGE}
    container_name: ipillgood-spring
    env_file:
      - .env
    depends_on:
      - redis
    expose:
      - "8080"
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-group: /ipillgood/spring
        awslogs-create-group: "true"
        awslogs-stream: spring
        awslogs-datetime-format: "%Y-%m-%dT%H:%M:%S"

  redis:
    image: redis:7-alpine
    container_name: ipillgood-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ipillgood-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - spring
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-group: /ipillgood/nginx
        awslogs-create-group: "true"
        awslogs-stream: nginx

volumes:
  redis-data:
