services:
  spring:
    image: ${ECR_IMAGE}
    container_name: ipillgood-spring
    env_file:
      - .env
    depends_on:
      - redis
    expose:
      - "8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ipillgood-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ipillgood-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - spring
    restart: unless-stopped

volumes:
  redis-data:
