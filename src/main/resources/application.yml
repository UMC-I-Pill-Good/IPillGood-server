spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: "IPillGood-server"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ipillgood}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: 3600000
  refresh-token-validity: 1209600000

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-lite-latest
  base-url: https://generativelanguage.googleapis.com

app:
  storage:
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://ipillgood-bucket.s3.ap-northeast-2.amazonaws.com}

springdoc:
  # 중첩 record가 짧은 이름(예: Request/Response의 Login)으로 충돌해 스키마가 덮어써지는 문제 방지
  use-fqn: true
