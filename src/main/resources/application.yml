spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: "IPillGood-server"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ipillgood}
    username: ${DB_USER}
    password: ${DB_PW}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      data-source-properties:
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:10000}"

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: ${SQL_LOG_FORMAT:false}
        log_slow_query: ${SLOW_QUERY_THRESHOLD_MS:300}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: 3600000
  refresh-token-validity: 1209600000

cors:
  allowed-origins:
    - http://localhost:3000
    - https://ipillgood.vercel.app
    - https://ipillgood.p-e.kr

social:
  kakao:
    user-info-uri: https://kapi.kakao.com/v2/user/me
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
  naver:
    user-info-uri: https://openapi.naver.com/v1/nid/me
    authorize-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/naver/callback}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-lite-latest
  base-url: https://generativelanguage.googleapis.com

app:
  cookie:
    same-site: ${COOKIE_SAME_SITE:None}
  frontend:
    callback-url: ${FRONTEND_CALLBACK_URL:http://localhost:3000/callback}
  image:
    base-url: ${IMAGE_BASE_URL:https://ipillgood-assets.s3.ap-northeast-2.amazonaws.com}
  storage:
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://ipillgood-bucket.s3.ap-northeast-2.amazonaws.com}
    bucket: ${S3_BUCKET:ipillgood-bucket}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    presign-expiration: 5m

notification:
  delivery:
    enabled: ${NOTIFICATION_DELIVERY_ENABLED:false}
    cron: ${NOTIFICATION_DELIVERY_CRON:0 * * * * *}
  firebase:
    service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

springdoc:
  # 중첩 record가 짧은 이름(예: Request/Response의 Login)으로 충돌해 스키마가 덮어써지는 문제 방지
  use-fqn: true

logging:
  level:
    "[org.hibernate.SQL]": ${SQL_LOG_LEVEL:INFO}
    "[org.hibernate.orm.jdbc.bind]": ${SQL_BIND_LOG_LEVEL:INFO}
