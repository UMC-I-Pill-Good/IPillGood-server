spring:
  # 테스트는 Redis 자동설정 제외 (InMemory로 대체)
  autoconfigure:
    exclude: org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop

# 테스트용 시크릿 키 (Base64, 32바이트 이상)
jwt:
  secret-key: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=

social:
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
  naver:
    client-id: test-naver-client-id
    client-secret: test-naver-client-secret
